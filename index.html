const mat=document.getElementById("matrix"),speed=document.getElementById("speed"),bright=document.getElementById("bright");
let t=0,running=false,timer=null,base=0;

function setup(){for(let i=0;i<W*H;i++){let d=document.createElement("i");d.className="led";mat.appendChild(d)}}

function on(ch){return ch==="X"||ch==="x"||ch==="1"||ch==="*"||ch==="#"||ch==="R"||ch==="G"||ch==="B"}
function clr(p){return p.color==="green"?"#20ff55":p.color==="blue"?"#2585ff":"#ff2020"}

/*
  IMPORTANT:
  blink_pattern adalah timeline satu dimensi.
  Kita tidak membelah string menjadi 16 baris.
  Setiap lane membaca timeline-nya sendiri pada frame t.
  64 LED horizontal adalah 64 sample waktu berturut-turut
  sehingga bentuk pola tetap terlihat dan bergerak sebagai script.
*/
function render(){
 const cells=[...mat.children];
 for(let i=0;i<W*H;i++){cells[i].className="led";cells[i].style.color="";cells[i].style.opacity=bright.value/100}

 for(let lane=0;lane<H;lane++){
   const p=P[(base+lane)%P.length];
   const s=p.pattern||"";
   if(!s)continue;
   const L=s.length;
   // 64 kolom adalah 64 langkah berturut-turut dari timeline.
   for(let c=0;c<W;c++){
     const ch=s[(t+c)%L];
     if(!on(ch))continue;
     const d=cells[lane*W+c];
     d.className="led on";
     d.style.color=clr(p);
   }
 }
 document.getElementById("frame").textContent=t;
 document.getElementById("base").textContent=base+1;
}

function tick(){
 if(!running)return;
 t++;
 // Setelah timeline terpanjang melewati satu putaran, pindah 16 lane berikutnya.
 if(t>=Math.max(...P.map(p=>(p.pattern||"").length))){
   t=0;base=(base+H)%P.length;
 }
 render();timer=setTimeout(tick,+speed.value);
}
play.onclick=()=>{if(running)return;running=true;status.textContent="BERJALAN";tick()};
stop.onclick=()=>{running=false;clearTimeout(timer);status.textContent="STOP"};
speed.oninput=()=>{if(running){clearTimeout(timer);tick()}};
bright.oninput=render;
full.onclick=()=>document.documentElement.requestFullscreen?.();
setup();render();
</script></body></html>
